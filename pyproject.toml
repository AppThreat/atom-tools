[project]
name = "atom-tools"
version = "0.9.1"
description = "Collection of tools for use with AppThreat/atom."
authors = [
  { name = "Team AppThreat", email = "cloud@appthreat.com" },
]
dependencies = ["cleo>=1.0.0", "jmespath>=1.0.0", "thefuzz>=0.22.1", "json-flatten>=0.3", "rich>=13.0.0"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
"Homepage" = "https://github.com/appthreat/atom-tools"
"Bug Tracker" = "https://github.com/appthreat/atom-tools/issues"

[project.scripts]
atom-tools = "atom_tools.cli.application:main"

[project.entry-points."console_scripts"]
atom-tools = "atom_tools.cli.application:main"

[project.optional-dependencies]
dev = [
"coverage",
"flake8",
"ruff>=0.14.0",
"mypy",
"pre-commit",
"pytest",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "atom_tools",
  "atom_tools.cli",
  "atom_tools.cli.commands",
  "atom_tools.lib"
]
include-package-data = true

[tool.ruff]
line-length = 99

[tool.ruff.format]
# Match the previous formatter defaults so existing files are not churned.
quote-style = "double"
indent-style = "space"

[tool.pylint]
ignore-long-lines = "[r|f][\"']"

[tool.pylint.design]
max-args = 6

[tool.pylint.format]
max-line-length = 99

[tool.pylint.logging]
logging-format-style = "new"

[tool.pylint.messages_control]
disable = "W1203,R0903,E0401"
