[project]
name = "atom-tools"
version = "1.0.3"
description = "Collection of tools for post-processing the reports of the AppThreat analysis ecosystem: atom slices, dosai (.NET), golem (Go) and rusi (Rust) flow reports."
authors = [
  { name = "Team AppThreat", email = "cloud@appthreat.com" },
]
dependencies = ["cleo>=1.0.0", "jmespath>=1.0.0", "thefuzz>=0.22.1", "json-flatten>=0.3", "rich>=13.0.0"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "appthreat",
  "atom",
  "dosai",
  "golem",
  "rusi",
  "reachability",
  "attack-surface",
  "crypto-reach",
  "openapi",
  "sarif",
  "static-analysis",
  "cbom",
]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
"Homepage" = "https://github.com/appthreat/atom-tools"
"Bug Tracker" = "https://github.com/appthreat/atom-tools/issues"

[project.scripts]
atom-tools = "atom_tools.cli.application:main"

[project.entry-points."console_scripts"]
atom-tools = "atom_tools.cli.application:main"

[project.optional-dependencies]
dev = [
"coverage",
"flake8",
"ruff>=0.14.0",
"mypy",
# test/test_kosi_openapi.py validates every converted document.
"openapi-spec-validator",
"pre-commit",
"pytest",
]
# The stdio MCP server behind `atom-tools explain --mcp`. Pinned below 2.0:
# the 2.x SDK renamed FastMCP to MCPServer and changed the registration API.
mcp = ["mcp>=1.0.0,<2"]
# Builds the lesson site in docs/ with `mkdocs build --strict`.
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "atom_tools",
  "atom_tools.cli",
  "atom_tools.cli.commands",
  "atom_tools.lib",
  "atom_tools.lib.adapters"
]
include-package-data = true

[tool.ruff]
line-length = 99

[tool.ruff.lint]
# Explicit rule selection so lint results stay stable across ruff releases
# instead of tracking whatever the default set becomes (ruff 0.16 widened its
# defaults, which broke the previously clean tree with hundreds of UP hits).
# This is ruff's long-standing default set, pinned on purpose.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Legacy assertion style in the filtering tests; == True/False comparisons
# are deliberate there and changing them would alter test semantics.
"test/test_filtering.py" = ["E712"]

[tool.ruff.format]
# Match the previous formatter defaults so existing files are not churned.
quote-style = "double"
indent-style = "space"

[tool.pylint]
ignore-long-lines = "[r|f][\"']"

[tool.pylint.design]
max-args = 6

[tool.pylint.format]
max-line-length = 99

[tool.pylint.logging]
logging-format-style = "new"

[tool.pylint.messages_control]
disable = "W1203,R0903,E0401"
